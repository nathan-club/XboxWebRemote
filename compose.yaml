services:
  xbox-web-remote:
    image: ${XWR_IMAGE:?set XWR_IMAGE to a published SHA tag or digest in .env}
    restart: unless-stopped
    ports:
      - "${XWR_BIND_ADDRESS:-127.0.0.1}:8977:8977"
    environment:
      XWR_ACCESS_USER: ${XWR_ACCESS_USER:-xbox}
      XWR_ACCESS_PASSWORD: ${XWR_ACCESS_PASSWORD:?set XWR_ACCESS_PASSWORD in .env}
      XWR_PUBLIC_ORIGIN: ${XWR_PUBLIC_ORIGIN:-}
      XWR_STUN_URLS: ${XWR_STUN_URLS:-}
      XWR_TURN_URL: ${XWR_TURN_URL:-}
      XWR_TURN_URL_FILE: ${XWR_TURN_URL_FILE:-}
      XWR_TURN_SECRET: ${XWR_TURN_SECRET:-}
      XWR_FORCE_RELAY: ${XWR_FORCE_RELAY:-0}
      XWR_VIDEO_BITRATE: ${XWR_VIDEO_BITRATE:-0}
    volumes:
      - xbox-auth:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  xbox-auth:
